name: Frontend production release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged staging to main release PR to deploy
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: frontend-production-release
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: registry.robocup.de/website/frontend

jobs:
  deploy-production:
    name: Validate and deploy tested image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://robocup.de
    steps:
      # Resolve the PR through the API so a manual dispatch can replace a lost closed event.
      - name: Resolve release pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          # Retry transient GitHub API errors (5xx) instead of failing the required check.
          for attempt in 1 2 3 4 5; do
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")" && break
            if (( attempt == 5 )); then
              exit 1
            fi
            sleep $(( attempt * 10 ))
          done
          echo "merged=$(jq -r '.merged' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r '.base.ref' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(jq -r '.head.ref' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "head_repository=$(jq -r '.head.repo.full_name' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "base_repository=$(jq -r '.base.repo.full_name' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "merge_commit_sha=$(jq -r '.merge_commit_sha' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' <<< "$pr_json")" >> "$GITHUB_OUTPUT"

      - name: Validate merged release PR origin
        env:
          PR_MERGED: ${{ steps.pull-request.outputs.merged }}
          BASE_REF: ${{ steps.pull-request.outputs.base_ref }}
          HEAD_REF: ${{ steps.pull-request.outputs.head_ref }}
          HEAD_REPOSITORY: ${{ steps.pull-request.outputs.head_repository }}
          BASE_REPOSITORY: ${{ steps.pull-request.outputs.base_repository }}
        run: |
          if [[ "$PR_MERGED" != 'true' \
            || "$BASE_REF" != 'main' \
            || "$HEAD_REF" != 'staging' \
            || "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo 'Production requires a merged PR from staging in this repository.' >&2
            exit 1
          fi

      - name: Check out merged main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source
          ref: ${{ steps.pull-request.outputs.merge_commit_sha }}
          token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

      - name: Verify merged tree and resolve candidate
        id: release
        env:
          MERGED_SHA: ${{ steps.pull-request.outputs.merge_commit_sha }}
          RELEASE_SHA: ${{ steps.pull-request.outputs.head_sha }}
        working-directory: source
        run: |
          git cat-file -e "${RELEASE_SHA}^{commit}" 2>/dev/null \
            || git fetch origin "$RELEASE_SHA"
          merged_tree="$(git rev-parse "${MERGED_SHA}^{tree}")"
          staging_tree="$(git rev-parse "${RELEASE_SHA}^{tree}")"
          if [[ "$merged_tree" != "$staging_tree" ]]; then
            echo 'Merged main tree differs from the tested staging tree.' >&2
            exit 1
          fi
          mapfile -t candidate_tags < <(git tag --points-at "$RELEASE_SHA" --list 'candidate-v*')
          if (( ${#candidate_tags[@]} != 1 )) \
            || [[ ! "${candidate_tags[0]}" =~ ^candidate-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo 'The tested staging commit must have exactly one valid candidate version tag.' >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          image="${IMAGE_REPOSITORY}:${version}-sha-${RELEASE_SHA}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Log in to the existing registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_URL }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify the tested immutable image
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
        run: docker manifest inspect "$RELEASE_IMAGE" > /dev/null

      - name: Publish desired production state for Argo CD
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.pull-request.outputs.head_sha }}
        working-directory: source
        run: |
          manifest_ref="$(git rev-parse HEAD)"
          ./scripts/publish-deployment-branch.sh \
            production "$manifest_ref" "$RELEASE_IMAGE" "$RELEASE_SHA" "$RELEASE_VERSION"

      - name: Wait for rollout and verify production
        env:
          FRONTEND_URLS: https://robocup.de,https://2027.robocup.org
          EXPECTED_RELEASE_SHA: ${{ steps.pull-request.outputs.head_sha }}
          EXPECTED_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        working-directory: source
        run: node src/scripts/smoke-test.mjs

      - name: Publish final version tag on the tested commit
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.pull-request.outputs.head_sha }}
        working-directory: source
        run: |
          tag="v${RELEASE_VERSION}"
          existing_sha="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
          if [[ -n "$existing_sha" && "$existing_sha" != "$RELEASE_SHA" ]]; then
            echo "$tag already points at another commit." >&2
            exit 1
          fi
          if [[ -z "$existing_sha" ]]; then
            git tag "$tag" "$RELEASE_SHA"
            git push origin "refs/tags/$tag"
          fi
