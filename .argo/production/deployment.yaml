apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
  name: frontend
  namespace: main-website
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
    spec:
      containers:
        - image: registry.robocup.de/website/frontend:2.8.0-sha-ba27dffa25e42ce177866800054d5b5fe691f4ee
          name: website-frontend
          env:
            - name: NUXT_RELEASE_VERSION
              value: "2.8.0"
            - name: NUXT_RELEASE_SHA
              value: "ba27dffa25e42ce177866800054d5b5fe691f4ee"
          envFrom:
            - secretRef:
                name: website-frontend
                optional: false
          imagePullPolicy: Always
      imagePullSecrets:
        - name: registry
