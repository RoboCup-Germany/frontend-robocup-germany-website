apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
  name: frontend
  namespace: main-website
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
    spec:
      containers:
        - image: registry.robocup.de/website/frontend:2.7.8-sha-316fd4fe382ba74623b0a4beb6268a16bd9212c1
          name: website-frontend
          env:
            - name: NUXT_RELEASE_VERSION
              value: "2.7.8"
            - name: NUXT_RELEASE_SHA
              value: "316fd4fe382ba74623b0a4beb6268a16bd9212c1"
          envFrom:
            - secretRef:
                name: website-frontend
                optional: false
          imagePullPolicy: Always
      imagePullSecrets:
        - name: registry
