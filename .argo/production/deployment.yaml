apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
  name: frontend
  namespace: main-website
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
    spec:
      containers:
        - image: registry.robocup.de/website/frontend:2.16.0-sha-b54b09d25551a52d800813b87626dedebafb3bb8
          name: website-frontend
          env:
            - name: NUXT_RELEASE_VERSION
              value: "2.16.0"
            - name: NUXT_RELEASE_SHA
              value: "b54b09d25551a52d800813b87626dedebafb3bb8"
          envFrom:
            - secretRef:
                name: website-frontend
                optional: false
          imagePullPolicy: Always
      imagePullSecrets:
        - name: registry
