apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
  name: frontend
  namespace: main-website
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
    spec:
      containers:
        - image: registry.robocup.de/website/frontend:2.7.3-sha-5cf63ba16435788f8e8c07e57c4d59d125b45ab2
          name: website-frontend
          env:
            - name: NUXT_RELEASE_VERSION
              value: "2.7.3"
            - name: NUXT_RELEASE_SHA
              value: "5cf63ba16435788f8e8c07e57c4d59d125b45ab2"
          envFrom:
            - secretRef:
                name: website-frontend
                optional: false
          imagePullPolicy: Always
      imagePullSecrets:
        - name: registry
