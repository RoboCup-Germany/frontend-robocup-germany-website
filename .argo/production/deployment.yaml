apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
  name: frontend
  namespace: main-website
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
    spec:
      containers:
        - image: registry.robocup.de/website/frontend:2.7.9-sha-b7b8daedaf27bae2be67387e65532a6a4a55036e
          name: website-frontend
          env:
            - name: NUXT_RELEASE_VERSION
              value: "2.7.9"
            - name: NUXT_RELEASE_SHA
              value: "b7b8daedaf27bae2be67387e65532a6a4a55036e"
          envFrom:
            - secretRef:
                name: website-frontend
                optional: false
          imagePullPolicy: Always
      imagePullSecrets:
        - name: registry
