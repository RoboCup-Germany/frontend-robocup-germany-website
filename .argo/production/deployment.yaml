apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
  name: frontend
  namespace: main-website
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
    spec:
      containers:
        - image: registry.robocup.de/website/frontend:2.12.0-sha-98d547e9875ec5c573c2b79403a95d65277a7ad2
          name: website-frontend
          env:
            - name: NUXT_RELEASE_VERSION
              value: "2.12.0"
            - name: NUXT_RELEASE_SHA
              value: "98d547e9875ec5c573c2b79403a95d65277a7ad2"
          envFrom:
            - secretRef:
                name: website-frontend
                optional: false
          imagePullPolicy: Always
      imagePullSecrets:
        - name: registry
