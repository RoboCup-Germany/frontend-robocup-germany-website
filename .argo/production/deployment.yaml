apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
  name: frontend
  namespace: main-website
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
    spec:
      containers:
        - image: registry.robocup.de/website/frontend:2.11.0-sha-e38e1c07f52b8bdd9c3de6743d4472005fb6616c
          name: website-frontend
          env:
            - name: NUXT_RELEASE_VERSION
              value: "2.11.0"
            - name: NUXT_RELEASE_SHA
              value: "e38e1c07f52b8bdd9c3de6743d4472005fb6616c"
          envFrom:
            - secretRef:
                name: website-frontend
                optional: false
          imagePullPolicy: Always
      imagePullSecrets:
        - name: registry
