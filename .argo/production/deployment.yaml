apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
  name: frontend
  namespace: main-website
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: apps.deployment-main-website-frontend
    spec:
      containers:
        - image: registry.robocup.de/website/frontend:2.9.1-sha-87715eb431ebb935cc42edf2fafa6278625e04ef
          name: website-frontend
          env:
            - name: NUXT_RELEASE_VERSION
              value: "2.9.1"
            - name: NUXT_RELEASE_SHA
              value: "87715eb431ebb935cc42edf2fafa6278625e04ef"
          envFrom:
            - secretRef:
                name: website-frontend
                optional: false
          imagePullPolicy: Always
      imagePullSecrets:
        - name: registry
