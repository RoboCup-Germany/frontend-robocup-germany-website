apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: website-frontend-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RoboCup-Germany/frontend-robocup-germany-website.git
    targetRevision: deploy/production
    path: .argo/production
  destination:
    server: https://kubernetes.default.svc
    namespace: main-website
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
