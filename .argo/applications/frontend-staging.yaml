apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: website-frontend-staging
  namespace: argo
spec:
  project: default
  source:
    repoURL: git@github.com:RoboCup-Germany/frontend-robocup-germany-website.git
    targetRevision: deploy/staging
    path: .argo/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging-website
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
